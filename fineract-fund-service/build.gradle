// fineract-fund-service: standalone Spring Boot microservice (Fund bounded context carve-out).
// Intentionally self-contained: it does NOT depend on any monolith fineract-* module and is
// deliberately excluded from the root fineractJavaProjects / fineractPublishProjects allowlists.

plugins {
    id 'java'
    // Versions are intentionally omitted: org.springframework.boot and io.spring.dependency-management
    // are already on the build classpath (declared by the root project / buildSrc).
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Fineract Fund Service (carve-out microservice)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Own database (database-per-service): PostgreSQL datasource + Liquibase migration that owns the schema.
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.liquibase:liquibase-core'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // error_prone_core satisfies the errorprone plugin applied to every project by the root build.gradle.
    errorprone 'com.google.errorprone:error_prone_core:2.35.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // H2 in-memory database for the @DataJpaTest slice test (fast, no Docker required).
    testRuntimeOnly 'com.h2database:h2'
    // Testcontainers: reproducible integration test running the real Liquibase migration on a real PostgreSQL.
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}
