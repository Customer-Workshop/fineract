spring.application.name=fineract-fund-service

# Default service port for the carved-out Fund microservice.
server.port=8090

# Own database (database-per-service). Env-overridable with sensible local defaults; never touches the monolith DB.
spring.datasource.url=jdbc:postgresql://${FUND_DB_HOST:localhost}:${FUND_DB_PORT:5432}/${FUND_DB_NAME:fineract_fund}
spring.datasource.username=${FUND_DB_USER:postgres}
spring.datasource.password=${FUND_DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Liquibase owns the schema; it runs on startup and creates m_fund.
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Hibernate only validates the Liquibase-managed schema (the migration is authoritative).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose the health endpoint for the smoke test / gateway parity check.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# HTTP Basic credentials for the single in-memory user. Override via env in compose/production.
fundservice.security.username=${FUND_SECURITY_USERNAME:mifos}
fundservice.security.password=${FUND_SECURITY_PASSWORD:password}

# springdoc / Swagger UI endpoints (permitted without auth by SecurityConfig).
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
