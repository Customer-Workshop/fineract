// fineract-gateway: standalone Spring Cloud Gateway application that routes the monolith-style
// external Fund path to the carved-out fineract-fund-service. Intentionally self-contained: it
// does NOT depend on any monolith fineract-* module and is deliberately excluded from the root
// fineractJavaProjects / fineractPublishProjects allowlists.

plugins {
    id 'java'
    // Versions are intentionally omitted: org.springframework.boot and io.spring.dependency-management
    // are already on the build classpath (declared by the root project / buildSrc).
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

description = 'Fineract Gateway (routes external Fund path to the fund-service carve-out)'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencyManagement {
    imports {
        // Spring Cloud release train compatible with Spring Boot 3.5.x (this module is self-contained
        // and does not inherit the root dependency management).
        mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2025.0.0'
    }
}

dependencies {
    // Reactive Spring Cloud Gateway (brings in spring-boot-starter-webflux).
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway'
    // Actuator exposes /actuator/health for the smoke test.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // error_prone_core satisfies the errorprone plugin applied to every project by the root build.gradle.
    errorprone 'com.google.errorprone:error_prone_core:2.35.1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
